name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check required variables
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_PASSWORD: ${{ vars.VITE_DEMO_PASSWORD }}
        run: |
          for name in VITE_API_URL VITE_DEMO_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable $name. Create it in Settings > Secrets and variables > Actions > Variables > New repository variable (not in Secrets and not in an Environment)."
              exit 1
            fi
          done
      - run: npm run build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables).
          # Both values end up in the public bundle, so they are variables and not secrets.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_PASSWORD: ${{ vars.VITE_DEMO_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
