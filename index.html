<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusGate: API de plataforma educativa construida para entender la seguridad con Spring Security y JWT." />
    <link rel="icon" type="image/svg+xml" href="./campusgate-icon.svg" />
    <title>CampusGate</title>
    <script>
      try {
        var saved = localStorage.getItem('campusgate-theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
